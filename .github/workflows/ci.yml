name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    env:
      # The bundled Electron binary is not needed for the model-free unit tests.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      # package-lock.json records a domestic mirror; let CI resolve from npmjs.
      npm_config_registry: https://registry.npmjs.org
      npm_config_replace_registry_host: always
    defaults:
      run:
        working-directory: workspace/query/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: workspace/query/frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type-check
        run: npx tsc -b
      - name: Unit tests (no models, no databases)
        run: npx vitest run
